server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # /id → /id/ without the container's own port in the address.
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  # Built files have a hash in their name; screenshots and icons change rarely. (add_header in a
  # location replaces the server's, so each one repeats the security headers.)
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/headers.inc;
  }

  location ~* \.(webp|png|jpg|svg|woff2|mp4)$ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/conf.d/headers.inc;
  }

  location / {
    add_header Cache-Control "public, max-age=300";
    include /etc/nginx/conf.d/headers.inc;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
